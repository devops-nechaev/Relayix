services:
  app:
    extends:
      file: compose.app.yaml
      service: app
    depends_on:
      db:
        condition: service_healthy
  db-tools:
    extends:
      file: compose.app.yaml
      service: db-tools
  db:
    image: ${POSTGRES_IMAGE:-postgres:17.11-trixie}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relayix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-relayix}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  db_data:
    name: ${RELAYIX_DB_VOLUME:-${COMPOSE_PROJECT_NAME:-relayix}_db_data}
