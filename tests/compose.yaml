# Isolated smoke test. No host ports or persistent database volumes.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relaynest
      POSTGRES_PASSWORD: ${RELAYIX_TEST_POSTGRES_PASSWORD:?generated test runtime required}
      POSTGRES_DB: relaynest
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relaynest']
      interval: 2s
      timeout: 2s
      retries: 30
  mock:
    environment:
      RELAYIX_TEST_CREDENTIALS_FILE: /run/relayix-test/credentials.json
      RELAYIX_TEST_BASE_URL: ${RELAYIX_TEST_BASE_URL:?generated test runtime required}
    image: python:3.13-alpine
    command: ['python', '/tests/mock_services.py']
    volumes:
      - ${RELAYIX_TEST_RUNTIME_DIR:?generated test runtime required}:/run/relayix-test:ro
      - ./:/tests:ro
  proxy:
    environment:
      RELAYIX_TEST_CREDENTIALS_FILE: /run/relayix-test/credentials.json
      RELAYIX_TEST_BASE_URL: ${RELAYIX_TEST_BASE_URL:?generated test runtime required}
    image: python:3.13-alpine
    command: ['python', '/tests/mock_proxy.py']
    volumes:
      - ${RELAYIX_TEST_RUNTIME_DIR:?generated test runtime required}:/run/relayix-test:ro
      - ./:/tests:ro
  app:
    image: ${RELAYIX_TEST_IMAGE:-relayix:0.6.1}
    environment:
      DATABASE_URL: postgres://relaynest:${RELAYIX_TEST_POSTGRES_PASSWORD:?generated test runtime required}@db:5432/relaynest
      ADMIN_TOKEN: ${RELAYIX_TEST_ADMIN_TOKEN:?generated test runtime required}
      ALLOW_INSECURE_HTTP: 'true'
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${RELAYIX_TEST_ADMIN_PASSWORD:?generated test runtime required}
      RETRY_BASE_SECONDS: '1'
    depends_on:
      db:
        condition: service_healthy
      mock:
        condition: service_started
      proxy:
        condition: service_started
  checks:
    image: ${RELAYIX_TEST_CHECKS_IMAGE:-relayix-checks:0.6.1}
    environment:
      RELAYIX_TEST_CREDENTIALS_FILE: /run/relayix-test/credentials.json
      RELAYIX_TEST_BASE_URL: ${RELAYIX_TEST_BASE_URL:?generated test runtime required}
      PGHOST: db
      PGUSER: relaynest
      PGPASSWORD: ${RELAYIX_TEST_POSTGRES_PASSWORD:?generated test runtime required}
      PGDATABASE: relaynest
    command: ['python', '-u', '/tests/smoke.py']
    volumes:
      - ${RELAYIX_TEST_RUNTIME_DIR:?generated test runtime required}:/run/relayix-test:ro
      - ./:/tests:ro
    depends_on:
      app:
        condition: service_started

  browser:
    environment:
      RELAYIX_TEST_CREDENTIALS_FILE: /run/relayix-test/credentials.json
      RELAYIX_TEST_BASE_URL: ${RELAYIX_TEST_BASE_URL:?generated test runtime required}
    image: ${RELAYIX_TEST_BROWSER_IMAGE:-relayix-browser:0.6.1}
    volumes:
      - ${RELAYIX_TEST_RUNTIME_DIR:?generated test runtime required}:/run/relayix-test:ro
      - ./:/tests:ro
      - ${RELAYIX_TEST_ARTIFACTS:-/tmp/relayix-test-artifacts}:/artifacts
    depends_on:
      app:
        condition: service_started
