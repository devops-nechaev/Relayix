name: relayix
services:
  app:
    image: ghcr.io/devops-nechaev/relayix:0.6.2
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080'
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-relayix}
      POSTGRES_DB: ${POSTGRES_DB:-relayix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_SSLMODE: disable
      POSTGRES_SSLROOTCERT: ''
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
      RUST_LOG: ${RUST_LOG:-relayix=info}
      PORT: '8080'
    # Python is included in the published image. Encode database credentials
    # inside the container so passwords can contain URL-reserved characters.
    command:
      - python3
      - -c
      - |
        import os
        from urllib.parse import quote, urlencode
        env = os.environ
        host = env['POSTGRES_HOST'].strip().removeprefix('[').removesuffix(']')
        if not host or any(c.isspace() or c in '/@?#\\' for c in host):
            raise SystemExit('POSTGRES_HOST must be a hostname or IP address')
        port = int(env['POSTGRES_PORT'])
        if not 1 <= port <= 65535:
            raise SystemExit('POSTGRES_PORT must be between 1 and 65535')
        host = '[' + host + ']' if ':' in host else host
        query = {'sslmode': env['POSTGRES_SSLMODE']}
        if env.get('POSTGRES_SSLROOTCERT'):
            query['sslrootcert'] = env['POSTGRES_SSLROOTCERT']
        env['DATABASE_URL'] = ('postgres://' + quote(env['POSTGRES_USER'], safe='')
            + ':' + quote(env['POSTGRES_PASSWORD'], safe='') + '@' + host + ':' + str(port)
            + '/' + quote(env['POSTGRES_DB'], safe='') + '?' + urlencode(query))
        os.execv('/usr/local/bin/relayix', ['relayix'])
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17.11-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relayix}
      POSTGRES_DB: ${POSTGRES_DB:-relayix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  db_data:
