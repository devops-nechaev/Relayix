name: Release Docker image
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate version and determine image
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/check_release.py
          python3 - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Release requires a numeric semantic version'
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Git tag must match Cargo version'
          assert json.loads(Path('web/package.json').read_text())['version'] == version, 'Web version differs'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('image=ghcr.io/' + os.environ['REPOSITORY'].lower() + '\n')
              output.write('version=' + version + '\n')
          PY
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:beta
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
